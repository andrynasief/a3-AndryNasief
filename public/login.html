<!doctype html>
<html lang='en' data-bs-theme='dark'>

<head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <meta name='description' content='Log in or create an account to access your jersey collection.' />
    <title>Log in — Jersey Collection</title>

    <link rel='preconnect' href='https://fonts.googleapis.com' />
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin />
    <link href='https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap'
        rel='stylesheet' />

    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' />
    <link rel='stylesheet' href='css/main.css' />

    <link rel='icon' type='image/svg+xml' href='favicon.svg' />
</head>

<body>
    <div class='container'>
        <div id='login-page' class='mx-auto text-center'>
            <h1 id='page-title' class='h3'>Jersey Collection</h1>
            <p id='login-hint' class='text-secondary-emphasis small'>Log in with any username and password. If that
                username doesn't exist yet, an account is created for you automatically.</p>

            <form id='login-form' class='card p-3 text-start'>
                <label for='username' class='form-label visually-hidden'>Username</label>
                <input type='text' class='form-control mb-2' id='username' name='username' placeholder='Username'
                    required />

                <label for='password' class='form-label visually-hidden'>Password</label>
                <input type='password' class='form-control mb-3' id='password' name='password' placeholder='Password'
                    required />

                <button type='submit' class='btn btn-primary'>Log in</button>
            </form>

            <p id='login-message' class='mt-3' role='alert'></p>
        </div>
    </div>

    <script src='js/login.js'></script>
</body>

</html>
