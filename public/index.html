<!doctype html>
<html lang='en' data-bs-theme='dark'>

<head>
  <meta charset='utf-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1' />
  <meta name='description'
    content='Manage your personal jersey collection — add, edit, and remove jerseys tied to your account.' />
  <title>CS4241 Assignment 3 - Jersey Collection</title>

  <link rel='preconnect' href='https://fonts.googleapis.com' />
  <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin />
  <link href='https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap'
    rel='stylesheet' />

  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' />
  <link rel='stylesheet' href='css/main.css' />

  <link rel='icon' type='image/svg+xml' href='favicon.svg' />
</head>

<body>
  <div class='container py-4'>
    <header id='app-header' class='d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4'>
      <h1 id='page-title' class='h3 mb-0'>Jersey Collection</h1>
      <div id='session-info' class='d-flex align-items-center gap-3'>
        <span id='current-username' class='text-secondary-emphasis small'></span>
        <button id='logout-button' type='button' class='btn btn-outline-secondary btn-sm'>Log out</button>
      </div>
    </header>

    <form id='jersey-form' class='card p-3 mb-4'>
      <div class='row g-2 align-items-end'>
        <div class='col-6 col-md-2'>
          <label for='team' class='form-label'>Team</label>
          <input type='text' class='form-control' id='team' name='team' required />
        </div>
        <div class='col-6 col-md-2'>
          <label for='player' class='form-label'>Player</label>
          <input type='text' class='form-control' id='player' name='player' required />
        </div>
        <div class='col-6 col-md-2'>
          <label for='number' class='form-label'>Number</label>
          <input type='number' class='form-control' id='number' name='number' min='0' max='99' required />
        </div>
        <div class='col-6 col-md-2'>
          <label for='size' class='form-label'>Size</label>
          <select id='size' name='size' class='form-select' required>
            <option value='' disabled selected>Choose…</option>
            <option value='S'>S</option>
            <option value='M'>M</option>
            <option value='L'>L</option>
            <option value='XL'>XL</option>
            <option value='XXL'>XXL</option>
          </select>
        </div>
        <div class='col-6 col-md-2'>
          <label for='price' class='form-label'>Price</label>
          <input type='number' class='form-control' id='price' name='price' min='0' step='0.01' required />
        </div>
        <div class='col-6 col-md-2'>
          <button type='submit' class='btn btn-primary w-100'>Add Jersey</button>
        </div>
      </div>
    </form>

    <section id='jersey-container' class='row g-3'></section>
  </div>

  <script src='js/main.js'></script>
</body>

</html>
